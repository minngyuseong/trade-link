server:
  port: 8083

spring:
  application:
    name: exchange-server
  datasource:
    url: jdbc:mysql://localhost:3306/exchange_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
  sql:
    init:
      mode: always

external:
  brokers:                        # 증권사 주소록: 코드 → 서버 주소
    A: ${BROKER_A_URL:http://localhost:8081/api}
    B: ${BROKER_B_URL:http://localhost:8082/api}
  depository-url: ${DEPOSITORY_URL:http://localhost:8084}

matching:
  worker:
    enabled: true
