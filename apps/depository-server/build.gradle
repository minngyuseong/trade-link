plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4' // Springdoc 및 HATEOAS와의 안정적 호환을 위해 3.3.x 권장 (팀 공통 버전에 맞춰 조정 가능)
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tradelink'
version = '0.0.1-SNAPSHOT'
description = 'TradeLink Depository Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. Spring MVC Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 2. 가이드 5장 핵심 요건: HATEOAS (_links 생성 지원)
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'

	// 3. 데이터베이스: JDBC & MySQL 커넥터
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 4. API 문서화: Swagger UI (Springdoc OpenAPI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// 5. 요청 검증 (@NotNull, @Positive 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 6. 코드 다이어트: Lombok (Getter, Setter, Constructor 자동 생성)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 7. 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}