# 1. 서버 포트 설정 (종관 예탁결제원)
server.port=8084

# 2. 애플리케이션 이름
spring.application.name=depository-server

# 3. 데이터베이스 연동 설정 (ksd_db)
spring.datasource.url=jdbc:mysql://localhost:3306/ksd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari 커넥션 풀
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 4. 외부 참여기관(거래소, 증권사) IP 및 포트 매핑
# 거래소 (수아)
tradelink.exchange-url=${EXCHANGE_URL:http://localhost:8083}

# 증권사 A, B (초현) - 대문자/소문자/BrokerClients 모든 규격 대응
tradelink.brokers.A=${BROKER_A_URL:http://localhost:8081/api}
tradelink.brokers.B=${BROKER_B_URL:http://localhost:8082/api}
tradelink.brokers.a=${BROKER_A_URL:http://localhost:8081/api}
tradelink.brokers.b=${BROKER_B_URL:http://localhost:8082/api}

tradelink.broker-urls.a=${BROKER_A_URL:http://localhost:8081/api}
tradelink.broker-urls.b=${BROKER_B_URL:http://localhost:8082/api}
tradelink.broker-urls.A=${BROKER_A_URL:http://localhost:8081/api}
tradelink.broker-urls.B=${BROKER_B_URL:http://localhost:8082/api}

# 5. 로깅 레벨
logging.level.root=INFO
logging.level.com.tradelink.depository=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html
external.brokers.A=${BROKER_A_URL:http://localhost:8081/api}
external.brokers.B=${BROKER_B_URL:http://localhost:8082/api}
spring.sql.init.mode=always
